#logging.level.com.zaxxer.hikari=DEBUG
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://mppu.mysql.tools:3306/mppu_test?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
spring.datasource.username=${TEST_MYSQL_USERNAME}
spring.datasource.password=${TEST_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.flyway.encoding=utf-8
spring.flyway.baseline-version=0
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
error.handling.http-status-in-json-response=true
error.handling.exception-logging=NO_LOGGING
error.handling.full-stacktrace-http-statuses=5xx
error.handling.log-levels.5xx=ERROR
#spring.docker.compose.lifecycle-management=start-only
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#management.endpoints.web.exposure.include=*
jwt.secret=${JVT_SECRET}
#spring.mail.properties.mail.debug=true
spring.mail.host=mail.adm.tools
spring.mail.port=465
spring.mail.username=recovery-password@mppu.org.ua
spring.mail.password=${MAIL_RECOVERY_PASSWORD}
spring.mail.default-encoding=utf-8
spring.mail.properties.mail.from=recovery-password@mppu.org.ua
spring.mail.properties.mail.smtp.from=recovery-password@mppu.org.ua
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
springdoc.swagger-ui.path=/swagger-ui.html
api.description=Web service provides work for baguette workshop
frontend.url=https://ramarnya.pp.ua
frontend.product-tracking-url=http://192.168.0.107:5173
server.address=0.0.0.0
api.version=v1.8.1
tos.uri=Anyone, anywhere
bot.token=${BOT_TOKEN}
chat.id=${CHAT_ID}
openai.api.key=${CHATGPT_KEY}
server.port=${PORT:8080}
gcp.region=${GCP_REGION:europe-west4}
gcp.service-name=${TARGET_SERVICE}
gcp.project-id=${GCP_PROJECT_ID}