name: Material catalog validation

on:
  push:
    branches:
      - feature/material-catalog-create
      - feature/work-price-editor
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Gradle clean test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run unit and integration tests
        run: bash ./gradlew clean test
